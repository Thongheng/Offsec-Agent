[project]
name = "offsec-agent"
version = "2.0.0"
description = "Structured, gate-enforced bug bounty hunting assistant"
requires-python = ">=3.10"
dependencies = ["pyyaml>=6.0"]

[project.scripts]
offsec = "offsec.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["offsec*"]
